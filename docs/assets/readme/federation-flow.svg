<svg xmlns="http://www.w3.org/2000/svg" width="960" height="404" viewBox="0 0 960 404" role="img" aria-labelledby="title desc"><title id="title">Federation message flow with data filtering, signing, encryption, identity and input checks.</title><desc id="desc">Illustrative Ruflo artwork. Motion is decorative; no live metrics. Supports reduced motion.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#181821"/><stop offset="1" stop-color="#101018"/></linearGradient><linearGradient id="neon"><stop stop-color="#27eaff"/><stop offset=".55" stop-color="#ffe32e"/><stop offset="1" stop-color="#ff168f"/></linearGradient><filter id="glow" x="-60%" y="-100%" width="220%" height="300%"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="1.5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="96" height="48" patternUnits="userSpaceOnUse"><path d="M0 0H96M0 24H96M48 0V24M0 24V48M96 24V48" fill="none" stroke="#8d6683" stroke-opacity=".13"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace}.flow{stroke-dasharray:12 40;animation:flow 5s linear infinite;filter:url(#glow)}.tube{filter:url(#glow);animation:flicker 13s linear infinite}.tube2{filter:url(#glow);animation:flicker 17s 3s linear infinite}.gold{fill:#ffe64c;filter:url(#soft)}@keyframes flicker{0%,43%,45%,47%,100%{opacity:1}44%,46%{opacity:.55}}.orbit{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.rise{animation:rise 7s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-208}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.rim{stroke-dasharray:90 390;animation:rim 9s linear infinite;filter:url(#glow)}.sweep{animation:sweep 8s ease-in-out infinite;opacity:.18}.halo{transform-box:fill-box;transform-origin:center;animation:halo 4s ease-out infinite}.equalizer{transform-box:fill-box;transform-origin:bottom;animation:eq 1.6s ease-in-out infinite alternate}@keyframes rim{to{stroke-dashoffset:-960}}@keyframes sweep{0%,100%{transform:translateX(-200px);opacity:0}30%,70%{opacity:.18}85%{transform:translateX(1100px);opacity:0}}@keyframes halo{0%{transform:scale(.8);opacity:0}25%{opacity:.4}100%{transform:scale(1.25);opacity:0}}@keyframes eq{from{transform:scaleY(.3)}to{transform:scaleY(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.sweep,.halo{display:none}}.packet{stroke-dasharray:7 93;stroke-dashoffset:7;opacity:0;stroke-linecap:round;animation:packet 12s linear infinite;filter:url(#glow)}.active{animation:active 12s ease-in-out infinite}.scan{animation:scan 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes packet{0%{stroke-dashoffset:7;opacity:0}1%{opacity:1}12.4%{stroke-dashoffset:-100;opacity:1}12.5%,100%{stroke-dashoffset:-100;opacity:0}}@keyframes active{0%,14%,100%{stroke:#29d9ed;fill:#141b29}1%,10%{stroke:#ffe649;fill:#33301b}}@keyframes scan{0%,100%{opacity:.2}50%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="958" height="402" rx="18" fill="url(#bg)" stroke="#26364e"/><rect width="960" height="404" rx="18" fill="url(#grid)"/><rect x="10" y="10" width="940" height="384" rx="14" fill="none" stroke="#ff168f" stroke-width="2.5" class="tube"/><rect x="13" y="13" width="934" height="378" rx="12" fill="none" stroke="#ff9ad0" stroke-opacity=".5" stroke-width=".7"/><rect class="rim" x="10" y="10" width="940" height="384" rx="14" fill="none" stroke="#ffc0e5" stroke-width="1.4"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#85cddd" stroke-width="1.5"/></marker></defs><text x="32" y="45" class="gold" font-size="26" font-weight="700">FEDERATION / TRUST IN MOTION</text><text x="32" y="73" fill="#b6c5db" font-size="15">A conceptual message path between agents on different machines.</text><path d="M238 151H302" fill="none" stroke="#27eaff" stroke-opacity=".25" stroke-width="2" marker-end="url(#arrow)"/><path class="packet" style="animation-delay:0.0s" d="M238 151H302" pathLength="100" fill="none" stroke="#27eaff" stroke-width="4"/><path d="M488 151H552" fill="none" stroke="#27eaff" stroke-opacity=".25" stroke-width="2" marker-end="url(#arrow)"/><path class="packet" style="animation-delay:1.5s" d="M488 151H552" pathLength="100" fill="none" stroke="#27eaff" stroke-width="4"/><path d="M738 151H820V220H145V267" fill="none" stroke="#27eaff" stroke-opacity=".25" stroke-width="2" marker-end="url(#arrow)"/><path class="packet" style="animation-delay:3.0s" d="M738 151H820V220H145V267" pathLength="100" fill="none" stroke="#27eaff" stroke-width="4"/><path d="M238 306H302" fill="none" stroke="#27eaff" stroke-opacity=".25" stroke-width="2" marker-end="url(#arrow)"/><path class="packet" style="animation-delay:4.5s" d="M238 306H302" pathLength="100" fill="none" stroke="#27eaff" stroke-width="4"/><path d="M488 306H552" fill="none" stroke="#27eaff" stroke-opacity=".25" stroke-width="2" marker-end="url(#arrow)"/><path class="packet" style="animation-delay:6.0s" d="M488 306H552" pathLength="100" fill="none" stroke="#27eaff" stroke-width="4"/><g><rect class="active" style="animation-delay:0.0s" x="52" y="112" width="186" height="78" rx="12" fill="#141b29" stroke="#29d9ed" stroke-width="1.5"/><text x="65" y="129" fill="#ff80c2" font-size="9" font-family="monospace">01</text><path d="M65 184H225" stroke="#27eaff" stroke-opacity=".15"/><text x="145" y="148" text-anchor="middle" fill="#ffe64c" font-size="20" font-weight="700">Outbound agent</text><text x="145" y="173" text-anchor="middle" fill="#bbcddd" font-size="13">Prepare shared work</text></g><g><rect class="active" style="animation-delay:1.5s" x="302" y="112" width="186" height="78" rx="12" fill="#141b29" stroke="#29d9ed" stroke-width="1.5"/><text x="315" y="129" fill="#ff80c2" font-size="9" font-family="monospace">02</text><path d="M315 184H475" stroke="#27eaff" stroke-opacity=".15"/><text x="395" y="148" text-anchor="middle" fill="#ffe64c" font-size="20" font-weight="700">Filter data</text><text x="395" y="173" text-anchor="middle" fill="#bbcddd" font-size="13">Apply outbound policy</text></g><g><rect class="active" style="animation-delay:3.0s" x="552" y="112" width="186" height="78" rx="12" fill="#141b29" stroke="#29d9ed" stroke-width="1.5"/><text x="565" y="129" fill="#ff80c2" font-size="9" font-family="monospace">03</text><path d="M565 184H725" stroke="#27eaff" stroke-opacity=".15"/><text x="645" y="148" text-anchor="middle" fill="#ffe64c" font-size="20" font-weight="700">Sign + encrypt</text><text x="645" y="173" text-anchor="middle" fill="#bbcddd" font-size="13">Protect the message</text></g><g><rect class="active" style="animation-delay:4.5s" x="52" y="267" width="186" height="78" rx="12" fill="#141b29" stroke="#29d9ed" stroke-width="1.5"/><text x="65" y="284" fill="#ff80c2" font-size="9" font-family="monospace">04</text><path d="M65 339H225" stroke="#27eaff" stroke-opacity=".15"/><text x="145" y="303" text-anchor="middle" fill="#ffe64c" font-size="20" font-weight="700">Verify identity</text><text x="145" y="328" text-anchor="middle" fill="#bbcddd" font-size="13">Check the sender</text></g><g><rect class="active" style="animation-delay:6.0s" x="302" y="267" width="186" height="78" rx="12" fill="#141b29" stroke="#29d9ed" stroke-width="1.5"/><text x="315" y="284" fill="#ff80c2" font-size="9" font-family="monospace">05</text><path d="M315 339H475" stroke="#27eaff" stroke-opacity=".15"/><text x="395" y="303" text-anchor="middle" fill="#ffe64c" font-size="20" font-weight="700">Inspect input</text><text x="395" y="328" text-anchor="middle" fill="#bbcddd" font-size="13">Apply trust + safety rules</text></g><g><rect class="active" style="animation-delay:7.5s" x="552" y="267" width="186" height="78" rx="12" fill="#141b29" stroke="#29d9ed" stroke-width="1.5"/><text x="565" y="284" fill="#ff80c2" font-size="9" font-family="monospace">06</text><path d="M565 339H725" stroke="#27eaff" stroke-opacity=".15"/><text x="645" y="303" text-anchor="middle" fill="#ffe64c" font-size="20" font-weight="700">Receiving agent</text><text x="645" y="328" text-anchor="middle" fill="#bbcddd" font-size="13">Accept permitted work</text></g><text x="820" y="192" text-anchor="middle" fill="#ff80c2" font-size="12">TRUST BOUNDARY</text><text x="32" y="380" fill="#8ea8bf" font-size="13">Audit events accompany the exchange. Policies and trust levels determine permitted actions.</text></svg>