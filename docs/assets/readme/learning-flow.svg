<svg xmlns="http://www.w3.org/2000/svg" width="960" height="404" viewBox="0 0 960 404" role="img" aria-labelledby="title desc"><title id="title">Illustrative learning cycle: recall, execute, evaluate, store, adapt and reuse.</title><desc id="desc">Illustrative Ruflo artwork. Motion is decorative; no live metrics. Supports reduced motion.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#181821"/><stop offset="1" stop-color="#101018"/></linearGradient><linearGradient id="neon"><stop stop-color="#27eaff"/><stop offset=".55" stop-color="#ffe32e"/><stop offset="1" stop-color="#ff168f"/></linearGradient><filter id="glow" x="-60%" y="-100%" width="220%" height="300%"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="1.5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="96" height="48" patternUnits="userSpaceOnUse"><path d="M0 0H96M0 24H96M48 0V24M0 24V48M96 24V48" fill="none" stroke="#8d6683" stroke-opacity=".13"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace}.flow{stroke-dasharray:12 40;animation:flow 5s linear infinite;filter:url(#glow)}.tube{filter:url(#glow);animation:flicker 13s linear infinite}.tube2{filter:url(#glow);animation:flicker 17s 3s linear infinite}.gold{fill:#ffe64c;filter:url(#soft)}@keyframes flicker{0%,43%,45%,47%,100%{opacity:1}44%,46%{opacity:.55}}.orbit{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.rise{animation:rise 7s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-208}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.packet{stroke-dasharray:2 98;stroke-linecap:round;animation:packet 3s linear infinite;filter:url(#glow)}.active{animation:active 12s ease-in-out infinite}.scan{animation:scan 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes packet{to{stroke-dashoffset:-100}}@keyframes active{0%,14%,100%{stroke:#29d9ed;fill:#141b29}4%,10%{stroke:#ffe649;fill:#33301b}}@keyframes scan{0%,100%{opacity:.2}50%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="958" height="402" rx="18" fill="url(#bg)" stroke="#26364e"/><rect width="960" height="404" rx="18" fill="url(#grid)"/><rect x="10" y="10" width="940" height="384" rx="14" fill="none" stroke="#ff168f" stroke-width="2.5" class="tube"/><rect x="13" y="13" width="934" height="378" rx="12" fill="none" stroke="#ff9ad0" stroke-opacity=".5" stroke-width=".7"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#85cddd" stroke-width="1.5"/></marker></defs><text x="32" y="45" class="gold" font-size="26" font-weight="700">EXPERIENCE BECOMES CONTEXT</text><text x="32" y="73" fill="#b6c5db" font-size="15">An illustrative learning cycle: capture, evaluate, retain and reuse.</text><path d="M258 150H387" fill="none" stroke="#ff45a1" stroke-opacity=".25" stroke-width="2" marker-end="url(#arrow)"/><path class="packet" style="animation-delay:0s" d="M258 150H387" pathLength="100" fill="none" stroke="#ff45a1" stroke-width="4"/><path d="M573 150H702" fill="none" stroke="#ff45a1" stroke-opacity=".25" stroke-width="2" marker-end="url(#arrow)"/><path class="packet" style="animation-delay:0s" d="M573 150H702" pathLength="100" fill="none" stroke="#ff45a1" stroke-width="4"/><path d="M795 189V267" fill="none" stroke="#ff45a1" stroke-opacity=".25" stroke-width="2" marker-end="url(#arrow)"/><path class="packet" style="animation-delay:0s" d="M795 189V267" pathLength="100" fill="none" stroke="#ff45a1" stroke-width="4"/><path d="M702 306H573" fill="none" stroke="#ff45a1" stroke-opacity=".25" stroke-width="2" marker-end="url(#arrow)"/><path class="packet" style="animation-delay:0s" d="M702 306H573" pathLength="100" fill="none" stroke="#ff45a1" stroke-width="4"/><path d="M387 306H258" fill="none" stroke="#ff45a1" stroke-opacity=".25" stroke-width="2" marker-end="url(#arrow)"/><path class="packet" style="animation-delay:0s" d="M387 306H258" pathLength="100" fill="none" stroke="#ff45a1" stroke-width="4"/><path d="M165 267V189" fill="none" stroke="#ff45a1" stroke-opacity=".25" stroke-width="2" marker-end="url(#arrow)"/><path class="packet" style="animation-delay:0s" d="M165 267V189" pathLength="100" fill="none" stroke="#ff45a1" stroke-width="4"/><g><rect class="active" style="animation-delay:0.0s" x="72" y="111" width="186" height="78" rx="12" fill="#141b29" stroke="#29d9ed" stroke-width="1.5"/><circle class="pulse" cx="90" cy="127" r="3" fill="#ff168f"/><text x="165" y="147" text-anchor="middle" fill="#ffe64c" font-size="20" font-weight="700">Recall</text><text x="165" y="172" text-anchor="middle" fill="#bbcddd" font-size="13">Find related experience</text></g><g><rect class="active" style="animation-delay:1.5s" x="387" y="111" width="186" height="78" rx="12" fill="#141b29" stroke="#29d9ed" stroke-width="1.5"/><circle class="pulse" cx="405" cy="127" r="3" fill="#ff168f"/><text x="480" y="147" text-anchor="middle" fill="#ffe64c" font-size="20" font-weight="700">Execute</text><text x="480" y="172" text-anchor="middle" fill="#bbcddd" font-size="13">Tools + agent actions</text></g><g><rect class="active" style="animation-delay:3.0s" x="702" y="111" width="186" height="78" rx="12" fill="#141b29" stroke="#29d9ed" stroke-width="1.5"/><circle class="pulse" cx="720" cy="127" r="3" fill="#ff168f"/><text x="795" y="147" text-anchor="middle" fill="#ffe64c" font-size="20" font-weight="700">Evaluate</text><text x="795" y="172" text-anchor="middle" fill="#bbcddd" font-size="13">Tests + task feedback</text></g><g><rect class="active" style="animation-delay:4.5s" x="702" y="267" width="186" height="78" rx="12" fill="#141b29" stroke="#29d9ed" stroke-width="1.5"/><circle class="pulse" cx="720" cy="283" r="3" fill="#ff168f"/><text x="795" y="303" text-anchor="middle" fill="#ffe64c" font-size="20" font-weight="700">Store</text><text x="795" y="328" text-anchor="middle" fill="#bbcddd" font-size="13">Keep useful trajectories</text></g><g><rect class="active" style="animation-delay:6.0s" x="387" y="267" width="186" height="78" rx="12" fill="#141b29" stroke="#29d9ed" stroke-width="1.5"/><circle class="pulse" cx="405" cy="283" r="3" fill="#ff168f"/><text x="480" y="303" text-anchor="middle" fill="#ffe64c" font-size="20" font-weight="700">Adapt</text><text x="480" y="328" text-anchor="middle" fill="#bbcddd" font-size="13">Update reusable patterns</text></g><g><rect class="active" style="animation-delay:7.5s" x="72" y="267" width="186" height="78" rx="12" fill="#141b29" stroke="#29d9ed" stroke-width="1.5"/><circle class="pulse" cx="90" cy="283" r="3" fill="#ff168f"/><text x="165" y="303" text-anchor="middle" fill="#ffe64c" font-size="20" font-weight="700">Reuse</text><text x="165" y="328" text-anchor="middle" fill="#bbcddd" font-size="13">Inform the next task</text></g><path class="flow" d="M322 228H638" stroke="#ffe32e" stroke-width="2"/><text x="480" y="217" text-anchor="middle" fill="#ffe64c" font-size="14">RECALL → ACTION → FEEDBACK</text><text x="32" y="379" fill="#8ea8bf" font-size="13">Learning quality depends on feedback and configuration; improvement is not guaranteed.</text></svg>