<svg xmlns="http://www.w3.org/2000/svg" width="960" height="404" viewBox="0 0 960 404" role="img" aria-labelledby="title desc"><title id="title">Self-learning agent architecture: user, Ruflo, router, swarm, agents, memory and LLM providers; memory feeds routing.</title><desc id="desc">Illustrative Ruflo artwork. Motion is decorative; no live metrics. Supports reduced motion.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#181821"/><stop offset="1" stop-color="#101018"/></linearGradient><linearGradient id="neon"><stop stop-color="#27eaff"/><stop offset=".55" stop-color="#ffe32e"/><stop offset="1" stop-color="#ff168f"/></linearGradient><filter id="glow" x="-60%" y="-100%" width="220%" height="300%"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="1.5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="96" height="48" patternUnits="userSpaceOnUse"><path d="M0 0H96M0 24H96M48 0V24M0 24V48M96 24V48" fill="none" stroke="#8d6683" stroke-opacity=".13"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace}.flow{stroke-dasharray:12 40;animation:flow 5s linear infinite;filter:url(#glow)}.tube{filter:url(#glow);animation:flicker 13s linear infinite}.tube2{filter:url(#glow);animation:flicker 17s 3s linear infinite}.gold{fill:#ffe64c;filter:url(#soft)}@keyframes flicker{0%,43%,45%,47%,100%{opacity:1}44%,46%{opacity:.55}}.orbit{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.rise{animation:rise 7s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-208}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.packet{stroke-dasharray:2 98;stroke-linecap:round;animation:packet 3s linear infinite;filter:url(#glow)}.active{animation:active 12s ease-in-out infinite}.scan{animation:scan 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes packet{to{stroke-dashoffset:-100}}@keyframes active{0%,14%,100%{stroke:#29d9ed;fill:#141b29}4%,10%{stroke:#ffe649;fill:#33301b}}@keyframes scan{0%,100%{opacity:.2}50%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="958" height="402" rx="18" fill="url(#bg)" stroke="#26364e"/><rect width="960" height="404" rx="18" fill="url(#grid)"/><rect x="10" y="10" width="940" height="384" rx="14" fill="none" stroke="#ff168f" stroke-width="2.5" class="tube"/><rect x="13" y="13" width="934" height="378" rx="12" fill="none" stroke="#ff9ad0" stroke-opacity=".5" stroke-width=".7"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#85cddd" stroke-width="1.5"/></marker></defs><text x="32" y="45" class="gold" font-size="26" font-weight="700">SELF-LEARNING AGENT ARCHITECTURE</text><text x="32" y="73" fill="#b6c5db" font-size="15">Follow a task through the harness. Return useful experience to future routing.</text><path d="M223 146H267" fill="none" stroke="#27eaff" stroke-opacity=".25" stroke-width="2" marker-end="url(#arrow)"/><path class="packet" style="animation-delay:0s" d="M223 146H267" pathLength="100" fill="none" stroke="#27eaff" stroke-width="4"/><path d="M453 146H497" fill="none" stroke="#27eaff" stroke-opacity=".25" stroke-width="2" marker-end="url(#arrow)"/><path class="packet" style="animation-delay:0s" d="M453 146H497" pathLength="100" fill="none" stroke="#27eaff" stroke-width="4"/><path d="M683 146H727" fill="none" stroke="#27eaff" stroke-opacity=".25" stroke-width="2" marker-end="url(#arrow)"/><path class="packet" style="animation-delay:0s" d="M683 146H727" pathLength="100" fill="none" stroke="#27eaff" stroke-width="4"/><path d="M820 185V259" fill="none" stroke="#27eaff" stroke-opacity=".25" stroke-width="2" marker-end="url(#arrow)"/><path class="packet" style="animation-delay:0s" d="M820 185V259" pathLength="100" fill="none" stroke="#27eaff" stroke-width="4"/><path d="M727 298H683" fill="none" stroke="#27eaff" stroke-opacity=".25" stroke-width="2" marker-end="url(#arrow)"/><path class="packet" style="animation-delay:0s" d="M727 298H683" pathLength="100" fill="none" stroke="#27eaff" stroke-width="4"/><path d="M497 298H453" fill="none" stroke="#27eaff" stroke-opacity=".25" stroke-width="2" marker-end="url(#arrow)"/><path class="packet" style="animation-delay:0s" d="M497 298H453" pathLength="100" fill="none" stroke="#27eaff" stroke-width="4"/><path d="M550 259V219H590V185" fill="none" stroke="#ff168f" stroke-opacity=".25" stroke-width="2" marker-end="url(#arrow)"/><path class="packet" style="animation-delay:0s" d="M550 259V219H590V185" pathLength="100" fill="none" stroke="#ff168f" stroke-width="4"/><text x="457" y="213" fill="#ff80c2" font-size="13" text-anchor="end">Learning feedback</text><g><rect class="active" style="animation-delay:0.0s" x="37" y="107" width="186" height="78" rx="12" fill="#141b29" stroke="#29d9ed" stroke-width="1.5"/><circle class="pulse" cx="55" cy="123" r="3" fill="#ff168f"/><text x="130" y="143" text-anchor="middle" fill="#ffe64c" font-size="20" font-weight="700">User</text><text x="130" y="168" text-anchor="middle" fill="#bbcddd" font-size="13">Goal + constraints</text></g><g><rect class="active" style="animation-delay:1.5s" x="267" y="107" width="186" height="78" rx="12" fill="#141b29" stroke="#29d9ed" stroke-width="1.5"/><circle class="pulse" cx="285" cy="123" r="3" fill="#ff168f"/><text x="360" y="143" text-anchor="middle" fill="#ffe64c" font-size="20" font-weight="700">Ruflo</text><text x="360" y="168" text-anchor="middle" fill="#bbcddd" font-size="13">CLI / MCP entry point</text></g><g><rect class="active" style="animation-delay:3.0s" x="497" y="107" width="186" height="78" rx="12" fill="#141b29" stroke="#29d9ed" stroke-width="1.5"/><circle class="pulse" cx="515" cy="123" r="3" fill="#ff168f"/><text x="590" y="143" text-anchor="middle" fill="#ffe64c" font-size="20" font-weight="700">Router</text><text x="590" y="168" text-anchor="middle" fill="#bbcddd" font-size="13">Select a work path</text></g><g><rect class="active" style="animation-delay:4.5s" x="727" y="107" width="186" height="78" rx="12" fill="#141b29" stroke="#29d9ed" stroke-width="1.5"/><circle class="pulse" cx="745" cy="123" r="3" fill="#ff168f"/><text x="820" y="143" text-anchor="middle" fill="#ffe64c" font-size="20" font-weight="700">Swarm</text><text x="820" y="168" text-anchor="middle" fill="#bbcddd" font-size="13">Coordinate the team</text></g><g><rect class="active" style="animation-delay:6.0s" x="727" y="259" width="186" height="78" rx="12" fill="#141b29" stroke="#29d9ed" stroke-width="1.5"/><circle class="pulse" cx="745" cy="275" r="3" fill="#ff168f"/><text x="820" y="295" text-anchor="middle" fill="#ffe64c" font-size="20" font-weight="700">Agents</text><text x="820" y="320" text-anchor="middle" fill="#bbcddd" font-size="13">Execute specialized work</text></g><g><rect class="active" style="animation-delay:7.5s" x="497" y="259" width="186" height="78" rx="12" fill="#141b29" stroke="#29d9ed" stroke-width="1.5"/><circle class="pulse" cx="515" cy="275" r="3" fill="#ff168f"/><text x="590" y="295" text-anchor="middle" fill="#ffe64c" font-size="20" font-weight="700">Memory</text><text x="590" y="320" text-anchor="middle" fill="#bbcddd" font-size="13">Recall + store context</text></g><g><rect class="active" style="animation-delay:9.0s" x="267" y="259" width="186" height="78" rx="12" fill="#141b29" stroke="#29d9ed" stroke-width="1.5"/><circle class="pulse" cx="285" cy="275" r="3" fill="#ff168f"/><text x="360" y="295" text-anchor="middle" fill="#ffe64c" font-size="20" font-weight="700">LLM providers</text><text x="360" y="320" text-anchor="middle" fill="#bbcddd" font-size="13">Model access</text></g><text x="32" y="379" fill="#8ea8bf" font-size="13">Conceptual flow • Cyan: task and context • Pink: feedback • No live metrics</text></svg>