<svg xmlns="http://www.w3.org/2000/svg" width="960" height="148" viewBox="0 0 960 148" role="img" aria-labelledby="title desc"><title id="title">GO DEEPER</title><desc id="desc">Illustrative Ruflo artwork. Motion is decorative; no live metrics. Supports reduced motion.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10192c"/><stop offset="1" stop-color="#080b16"/></linearGradient><linearGradient id="neon"><stop stop-color="#3ae8ed"/><stop offset=".55" stop-color="#a88cff"/><stop offset="1" stop-color="#ff58bc"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7f9cce" stroke-opacity=".07"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace}.flow{stroke-dasharray:8 18;animation:flow 8s linear infinite}.orbit{transform-box:fill-box;transform-origin:center;animation:spin 28s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.rise{animation:rise 7s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-208}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="958" height="146" rx="18" fill="url(#bg)" stroke="#26364e"/><rect width="960" height="148" rx="18" fill="url(#grid)"/><path d="M24 130H936" stroke="url(#neon)" stroke-opacity=".25"/><path class="flow" d="M24 130H936" stroke="url(#neon)"/><text x="30" y="33" fill="#73a1ba" font-size="11" letter-spacing="3">RUFLO / 05</text><text x="30" y="76" fill="#f1f6ff" font-size="30" font-weight="700" letter-spacing="1">GO DEEPER</text><text x="31" y="105" fill="#aabbd2" font-size="16">Guides, architecture, benchmarks and verification.</text><g transform="translate(850 68)"><circle class="pulse" r="49" fill="#36e5e9" fill-opacity=".045"/><g fill="none" stroke="#51e7ed" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -22Q-18 -32 -32 -23V26Q-18 16 0 26Q18 16 32 26V-23Q18 -32 0 -22V26"/></g><circle class="orbit" r="43" fill="none" stroke="#ff67be" stroke-width="1.5" stroke-dasharray="26 109" opacity=".7"/></g><path d="M735 28H774M735 34H760M916 103H933" stroke="#bb70ed" opacity=".4"/></svg>