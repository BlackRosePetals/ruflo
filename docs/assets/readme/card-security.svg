<svg xmlns="http://www.w3.org/2000/svg" width="448" height="232" viewBox="0 0 448 232" role="img" aria-labelledby="title desc"><title id="title">Security controls</title><desc id="desc">Illustrative Ruflo artwork. Motion is decorative; no live metrics. Supports reduced motion.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10192c"/><stop offset="1" stop-color="#080b16"/></linearGradient><linearGradient id="neon"><stop stop-color="#3ae8ed"/><stop offset=".55" stop-color="#a88cff"/><stop offset="1" stop-color="#ff58bc"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7f9cce" stroke-opacity=".07"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace}.flow{stroke-dasharray:8 18;animation:flow 8s linear infinite}.orbit{transform-box:fill-box;transform-origin:center;animation:spin 28s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.rise{animation:rise 7s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-208}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="446" height="230" rx="18" fill="url(#bg)" stroke="#26364e"/><rect width="448" height="232" rx="18" fill="url(#grid)"/><g transform="translate(64 66)"><circle class="pulse" r="49" fill="#36e5e9" fill-opacity=".045"/><g fill="none" stroke="#51e7ed" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -32L28 -20V0Q27 22 0 36Q-27 22 -28 0V-20Z"/><path d="M-13 0L-3 10L16 -12"/></g><circle class="orbit" r="43" fill="none" stroke="#ff67be" stroke-width="1.5" stroke-dasharray="26 109" opacity=".7"/></g><text x="126" y="45" fill="#78a0bb" font-size="10" letter-spacing="2">RUFLO / CAPABILITY</text><text x="126" y="78" fill="#f0f5ff" font-size="23" font-weight="700">Security controls</text><text x="27" y="145" fill="#b2c4d9" font-size="17">Inspect inputs and tool access.</text><text x="27" y="171" fill="#b2c4d9" font-size="17">Keep decisions auditable.</text><path d="M27 207H421" stroke="#22364e"/><path class="flow" d="M27 207H421" stroke="url(#neon)" stroke-width="2"/><circle class="pulse" cx="421" cy="207" r="4" fill="#50e9ec"/></svg>