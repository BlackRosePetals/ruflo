<svg xmlns="http://www.w3.org/2000/svg" width="448" height="232" viewBox="0 0 448 232" role="img" aria-labelledby="title desc"><title id="title">Security controls</title><desc id="desc">Illustrative Ruflo artwork. Motion is decorative; no live metrics. Supports reduced motion.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#181821"/><stop offset="1" stop-color="#101018"/></linearGradient><linearGradient id="neon"><stop stop-color="#27eaff"/><stop offset=".55" stop-color="#ffe32e"/><stop offset="1" stop-color="#ff168f"/></linearGradient><filter id="glow" x="-60%" y="-100%" width="220%" height="300%"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="1.5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="96" height="48" patternUnits="userSpaceOnUse"><path d="M0 0H96M0 24H96M48 0V24M0 24V48M96 24V48" fill="none" stroke="#8d6683" stroke-opacity=".13"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace}.flow{stroke-dasharray:12 40;animation:flow 5s linear infinite;filter:url(#glow)}.tube{filter:url(#glow);animation:flicker 13s linear infinite}.tube2{filter:url(#glow);animation:flicker 17s 3s linear infinite}.gold{fill:#ffe64c;filter:url(#soft)}@keyframes flicker{0%,43%,45%,47%,100%{opacity:1}44%,46%{opacity:.55}}.orbit{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.rise{animation:rise 7s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-208}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.rim{stroke-dasharray:90 390;animation:rim 9s linear infinite;filter:url(#glow)}.sweep{animation:sweep 8s ease-in-out infinite;opacity:.18}.halo{transform-box:fill-box;transform-origin:center;animation:halo 4s ease-out infinite}.equalizer{transform-box:fill-box;transform-origin:bottom;animation:eq 1.6s ease-in-out infinite alternate}@keyframes rim{to{stroke-dashoffset:-960}}@keyframes sweep{0%,100%{transform:translateX(-200px);opacity:0}30%,70%{opacity:.18}85%{transform:translateX(1100px);opacity:0}}@keyframes halo{0%{transform:scale(.8);opacity:0}25%{opacity:.4}100%{transform:scale(1.25);opacity:0}}@keyframes eq{from{transform:scaleY(.3)}to{transform:scaleY(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.sweep,.halo{display:none}}</style><rect x="1" y="1" width="446" height="230" rx="18" fill="url(#bg)" stroke="#26364e"/><rect width="448" height="232" rx="18" fill="url(#grid)"/><rect x="10" y="10" width="428" height="212" rx="14" fill="none" stroke="#ff168f" stroke-width="2.5" class="tube"/><rect x="13" y="13" width="422" height="206" rx="12" fill="none" stroke="#ff9ad0" stroke-opacity=".5" stroke-width=".7"/><rect class="rim" x="10" y="10" width="428" height="212" rx="14" fill="none" stroke="#ffc0e5" stroke-width="1.4"/><g transform="translate(64 66)"><circle class="pulse" r="49" fill="#36e5e9" fill-opacity=".045"/><g class="tube2" fill="none" stroke="#26eaff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -32L28 -20V0Q27 22 0 36Q-27 22 -28 0V-20Z"/><path d="M-13 0L-3 10L16 -12"/></g><circle class="halo" r="50" fill="none" stroke="#27eaff" stroke-width="1"/><circle class="orbit" style="animation-direction:reverse;animation-duration:21s" r="53" fill="none" stroke="#ffe64c" stroke-width="1" stroke-dasharray="3 28"/><circle class="orbit" r="43" fill="none" stroke="#ff168f" stroke-width="1.5" stroke-dasharray="26 109" opacity=".7"/></g><text x="126" y="45" fill="#ff80c2" font-size="10" letter-spacing="2">RUFLO / CAPABILITY</text><text x="126" y="78" class="gold" font-size="23" font-weight="700">Security controls</text><text x="27" y="145" fill="#b2c4d9" font-size="17">Inspect inputs and tool access.</text><text x="27" y="171" fill="#b2c4d9" font-size="17">Keep decisions auditable.</text><path d="M27 207H421" stroke="#22364e"/><path class="flow" d="M27 207H421" stroke="url(#neon)" stroke-width="2"/><circle class="pulse" cx="421" cy="207" r="4" fill="#50e9ec"/></svg>