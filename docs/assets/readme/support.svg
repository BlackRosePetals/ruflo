<svg xmlns="http://www.w3.org/2000/svg" width="960" height="148" viewBox="0 0 960 148" role="img" aria-labelledby="title desc"><title id="title">BUILD WITH THE COMMUNITY</title><desc id="desc">Illustrative Ruflo artwork. Motion is decorative; no live metrics. Supports reduced motion.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#181821"/><stop offset="1" stop-color="#101018"/></linearGradient><linearGradient id="neon"><stop stop-color="#27eaff"/><stop offset=".55" stop-color="#ffe32e"/><stop offset="1" stop-color="#ff168f"/></linearGradient><filter id="glow" x="-60%" y="-100%" width="220%" height="300%"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="1.5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="96" height="48" patternUnits="userSpaceOnUse"><path d="M0 0H96M0 24H96M48 0V24M0 24V48M96 24V48" fill="none" stroke="#8d6683" stroke-opacity=".13"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace}.flow{stroke-dasharray:12 40;animation:flow 5s linear infinite;filter:url(#glow)}.tube{filter:url(#glow);animation:flicker 13s linear infinite}.tube2{filter:url(#glow);animation:flicker 17s 3s linear infinite}.gold{fill:#ffe64c;filter:url(#soft)}@keyframes flicker{0%,43%,45%,47%,100%{opacity:1}44%,46%{opacity:.55}}.orbit{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.rise{animation:rise 7s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-208}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="958" height="146" rx="18" fill="url(#bg)" stroke="#26364e"/><rect width="960" height="148" rx="18" fill="url(#grid)"/><rect x="10" y="10" width="940" height="128" rx="14" fill="none" stroke="#ff168f" stroke-width="2.5" class="tube"/><rect x="13" y="13" width="934" height="122" rx="12" fill="none" stroke="#ff9ad0" stroke-opacity=".5" stroke-width=".7"/><path d="M24 130H936" stroke="url(#neon)" stroke-opacity=".25"/><path class="flow" d="M24 130H936" stroke="url(#neon)"/><text x="30" y="33" fill="#ff80c2" font-size="11" letter-spacing="3">RUFLO / 06</text><text x="30" y="76" class="gold" font-size="30" font-weight="700" letter-spacing="1">BUILD WITH THE COMMUNITY</text><text x="31" y="105" fill="#aabbd2" font-size="16">Find answers. Share ideas. Move the ecosystem forward.</text><g transform="translate(850 68)"><circle class="pulse" r="49" fill="#36e5e9" fill-opacity=".045"/><g class="tube2" fill="none" stroke="#26eaff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0L-30 -22M0 0L30 -22M0 0L-30 24M0 0L30 24"/><circle r="10"/><circle cx="-30" cy="-22" r="6"/><circle cx="30" cy="-22" r="6"/><circle cx="-30" cy="24" r="6"/><circle cx="30" cy="24" r="6"/></g><circle class="orbit" r="43" fill="none" stroke="#ff168f" stroke-width="1.5" stroke-dasharray="26 109" opacity=".7"/></g><path d="M735 28H774M735 34H760M916 103H933" stroke="#ffe32e" opacity=".4"/></svg>