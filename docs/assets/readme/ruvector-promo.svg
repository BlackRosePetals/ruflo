<svg xmlns="http://www.w3.org/2000/svg" width="640" height="112" viewBox="0 0 640 112" role="img" aria-labelledby="title desc"><title id="title">RuVector — search, remember, learn</title><desc id="desc">Local vector search and persistent memory for AI agents. Explore the RuVector repository. Illustration, not live data.</desc><defs><linearGradient id="bg"><stop stop-color="#101c2d"/><stop offset="1" stop-color="#090d18"/></linearGradient><linearGradient id="accent"><stop stop-color="#23e9ee"/><stop offset="1" stop-color="#ff2f9c"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.signal{stroke-dasharray:5 23;animation:signal 4s linear infinite}.node{animation:node 3s ease-in-out infinite}.arrow{animation:arrow 3s ease-in-out infinite}@keyframes signal{to{stroke-dashoffset:-112}}@keyframes node{0%,100%{opacity:.4}50%{opacity:1}}@keyframes arrow{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="638" height="110" rx="10" fill="url(#bg)" stroke="#294653"/><path d="M15 110H625" stroke="url(#accent)" stroke-width="2"/><g fill="none" stroke="#255d70"><path d="M27 55L51 26L79 42L69 79L34 86Z M27 55L69 79M51 26L69 79M34 86L79 42"/></g><path class="signal" d="M27 55L51 26L79 42L69 79L34 86Z" stroke="#28e8f2" fill="none" stroke-width="2"/><g fill="#26e8ef"><circle class="node" cx="27" cy="55" r="4"/><circle class="node" style="animation-delay:.5s" cx="51" cy="26" r="4"/><circle class="node" style="animation-delay:1s" cx="79" cy="42" r="4"/><circle class="node" style="animation-delay:1.5s" cx="69" cy="79" r="4"/><circle class="node" style="animation-delay:2s" cx="34" cy="86" r="4"/></g><text x="108" y="25" fill="#ff71b7" font-size="9" letter-spacing="2.5">RUFLO ECOSYSTEM</text><text x="106" y="57" fill="#f5f5ee" font-size="30" font-weight="700" letter-spacing="-1">RuVector</text><text x="258" y="55" fill="#ffe33b" font-size="12" font-weight="