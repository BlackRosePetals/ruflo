<svg xmlns="http://www.w3.org/2000/svg" width="960" height="44" viewBox="0 0 960 44" role="img" aria-labelledby="title desc"><title id="title">Ruflo signal divider</title><desc id="desc">Illustrative Ruflo artwork. Motion is decorative; no live metrics. Supports reduced motion.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10192c"/><stop offset="1" stop-color="#080b16"/></linearGradient><linearGradient id="neon"><stop stop-color="#3ae8ed"/><stop offset=".55" stop-color="#a88cff"/><stop offset="1" stop-color="#ff58bc"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7f9cce" stroke-opacity=".07"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace}.flow{stroke-dasharray:8 18;animation:flow 8s linear infinite}.orbit{transform-box:fill-box;transform-origin:center;animation:spin 28s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.rise{animation:rise 7s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-208}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="958" height="42" rx="18" fill="url(#bg)" stroke="#26364e"/><rect width="960" height="44" rx="18" fill="url(#grid)"/><path d="M20 22H390L410 10H550L570 22H940" fill="none" stroke="#294359"/><path class="flow" d="M20 22H390L410 10H550L570 22H940" fill="none" stroke="url(#neon)"/><text x="480" y="31" text-anchor="middle" fill="#80a9bf" font-size="10" letter-spacing="3">RUFLO</text></svg>